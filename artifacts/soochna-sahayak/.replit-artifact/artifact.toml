kind = "web"
previewPath = "/"
title = "Soochna Sahayak"
version = "1.0.0"
id = "artifacts/soochna-sahayak"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19119

[services.development]
run = "pnpm --filter @workspace/soochna-sahayak run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/soochna-sahayak", "run", "build" ]
publicDir = "artifacts/soochna-sahayak/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19119"
BASE_PATH = "/"
